[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "commsfail"
version = "0.1.0"
description = "Communication-failure analysis of multi-agent message boards: traces, annotators, the analysis.v1 record."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Xisen Wang" }]
keywords = ["multi-agent", "llm", "communication", "failure-analysis", "sharednet"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []            # the core is standard library only, on purpose

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
commsfail = "commsfail.cli:main"

[project.urls]
Source = "https://github.com/xisen-w/commsfail"
Issues = "https://github.com/xisen-w/commsfail/issues"

[tool.setuptools.packages.find]
include = ["commsfail*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
